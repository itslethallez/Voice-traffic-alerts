name: Refresh central Waze alert mirror

# Every 5 minutes - GitHub's scheduler isn't millisecond-precise and can
# slip under load, but that's an acceptable trade for keeping this off a
# Vercel Cron whose minimum interval depends on the linked project's plan.
# See scripts/refreshWazeAlerts.js's header comment: this only mirrors
# Waze into the database for later use - the app's own live alert
# pipeline (src/api/waze/client.ts) still polls OpenWeb Ninja directly and
# is untouched by this job.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env for the ingest script
        run: |
          echo "EXPO_PUBLIC_WAZE_API_KEY=${{ secrets.EXPO_PUBLIC_WAZE_API_KEY }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Run Waze alert mirror
        run: node scripts/refreshWazeAlerts.js
